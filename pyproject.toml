[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bangumi2mal"
version = "0.1.0"
description = "A small, self-hosted Bangumi to MyAnimeList migration and sync tool"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "2ertwo"}]
dependencies = [
    "APScheduler>=3.10,<4",
    "Flask>=3.0,<4",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
]
deploy = [
    "gunicorn>=22,<24; platform_system != 'Windows'",
]

[project.scripts]
bangumi2mal = "bangumi2mal.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
